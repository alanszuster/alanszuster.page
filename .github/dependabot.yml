version: 2
updates:
  # Keeps the pinned action SHAs in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native compiler) breaks ts-jest (no JS compiler API) and typescript-eslint
      # (supports it from 7.1). We run 6.0.x, the last release with the JS API. Drop this
      # once both tools support 7.
      - dependency-name: typescript
        versions: [">=7"]
